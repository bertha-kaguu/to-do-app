<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional To-Do App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="status-legend">
        <div class="legend-item overdue-legend">
            <span class="legend-color"></span>
            <span>Overdue</span>
        </div>
    
        <div class="legend-item today-legend">
            <span class="legend-color"></span>
            <span>Due Today</span>
        </div>
    
        <div class="legend-item tomorrow-legend">
            <span class="legend-color"></span>
            <span>Due Tomorrow</span>
        </div>
    </div>
<div class="container">
    <h1>My To-Do List</h1>
    <div class="search-container">
        <input type="text" id="searchBar" placeholder="Search tasks...">
    </div>    
<!-- Task input -->
<div class="input-section">
    <input type="text" id="taskInput" placeholder="Enter a task...">
    <input type="date" id="dueDate">
    <select id="prioritySelect">
        <option value="" disabled selected>Priority</option>
        <option value="High">🔴 High</option>
        <option value="Medium">🟡 Medium</option>
        <option value="Low">🟢 Low</option>
    </select>
        <select id="categorySelect">
            <option value="General">General</option>
            <option value="Work">Work</option>
            <option value="Personal">Personal</option>
            <option value="Shopping">Shopping</option>
        </select>
    <button id="addTaskBtn">Add</button>
</div>

<!-- Filters --> 
<div class="filters"> 
    <button data-filter="all">All</button> 
    <button data-filter="active">Active</button> 
    <button data-filter="completed">Completed</button> 
</div> 

<!-- Task counter -->
<div id="taskCounter">0 tasks left</div>

<!-- Theme toggle --> 
<div class="theme-toggle-container">
    <button id="themeToggle" class="theme-btn">Dark Mode</button>
</div>
<ul id="taskList"></ul>

</div>

<script src="script.js"></script>

</body>
</html>
